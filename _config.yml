# Jake Chanenson — jakec007.github.io

# ── Site identity ─────────────────────────────────────
# `url` is required by jekyll-sitemap and by absolute_url (og:url, JSON-LD).
# Without it the sitemap emits relative paths and Google rejects it.
url: "https://jakec007.github.io"
baseurl: ""

title: Jake Chanenson
tagline: "Children's Privacy & Youth AI Safety"
author: G. Jake Chanenson

description: "Jake Chanenson studies how to protect young people's privacy and safety in the technology they are required to use and the technology they choose, from K-12 EdTech to AI, at the University of Chicago."
rss-description: "Jake Chanenson: research on children's privacy, youth AI safety, and AI governance for minors."

keywords: "children's privacy, youth AI safety, AI safety for young people, K-12 student data privacy, EdTech privacy, AI governance for minors, child safety in AI systems, COPPA, FERPA, human-computer interaction"

# Default social card image (used for og:image / twitter:image)
og-image: "/assets/img/JC_Profile_square.jpeg"

# ── Identity links (feed JSON-LD sameAs) ──────────────
profile-links:
  - "https://scholar.google.com/citations?user=t1_X4-YAAAAJ&hl=en"
  - "https://github.com/JakeC007"
  - "https://hci.social/@jchanen1"
  - "https://bsky.app/profile/jchanenson.bsky.social"
  - "https://www.youthaisafety.com/"

affiliation: "University of Chicago"
affiliation-url: "https://www.uchicago.edu/"
lab: "Amyoli Internet Research Lab"
lab-url: "https://airlab.cs.uchicago.edu/"

expertise:
  - "Children's privacy"
  - "Youth AI safety"
  - "AI safety for young people"
  - "AI governance for minors"
  - "Child safety in AI systems"
  - "Educational technology privacy"
  - "K-12 student data protection"
  - "Human-computer interaction"
  - "Usable privacy and security"
  - "Privacy law and policy"

social-network-links:
  email: "jchanen1@uchicago.edu"
  github: JakeC007
  rss: true

url-pretty: "jakec007.github.io"
title-on-all-pages: true
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true

date_format: "%B %-d, %Y"
timezone: "America/Chicago"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5
paginate_path: "/blog/page:num/"

kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: false
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - _copy/
  - "Claude outputs/"
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - beautiful-jekyll-theme.gemspec

plugins:
  - jekyll-paginate
  - jekyll-sitemap
